   <text style="font-size: 8.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans'; fill: #898781" transform="translate(10.8 285.573587)">7-file subset, Voxtral, paired across files, each language on its own unit; above zero is worse than unity.</text>
