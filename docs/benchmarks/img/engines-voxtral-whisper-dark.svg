  <g id="text_27">
   <text style="font-size: 8.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans'; fill: #898781" transform="translate(10.8 290.901587)">Idle M2 Ultra; Voxtral is one deterministic run, Whisper the mean of 3 runs with its printed 95% t-interval.</text>
