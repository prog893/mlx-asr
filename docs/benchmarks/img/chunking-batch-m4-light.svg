  <g id="text_29">
   <text style="font-weight: 700; font-size: 10px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="10.8" y="18.3" transform="rotate(-0 10.8 18.3)">Voxtral: batch size end to end at 60s chunks (M4)</text>
  </g>
  <g id="text_30">
   <text style="font-size: 8.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans'; fill: #898781" transform="translate(10.8 269.301587)">20-file corpus, M4 16GB, 60s chunks, kv8, delay 2400ms, one run per batch on AC power. A file of 16 chunks or fewer fits in one batch from B16 up; B48 exceeds</text>
   <text style="font-size: 8.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans'; fill: #898781" transform="translate(10.8 277.751948)">the M4's ~8.4GB KV wall, so B32 is the largest batch that runs reliably. Source: chunking.md.</text>
  </g>
