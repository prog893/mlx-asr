   <text style="font-size: 8.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans'; fill: #898781" transform="translate(10.8 290.901587)">Idle M2 Ultra; Voxtral is one deterministic run, Whisper the mean of 3 runs with its printed 95% t-interval. The speed bar spans</text>
   <text style="font-size: 8.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans'; fill: #898781" transform="translate(10.8 299.301479)">Whisper's 3 runs around the middle one. Voxtral is the default because it is faster than every Whisper run and needs no language</text>
   <text style="font-size: 8.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans'; fill: #898781" transform="translate(10.8 307.810278)">hint or stability flag, while Whisper's accuracy lead is under 2 points. Source: engines.md.</text>
  </g>
 </g>
