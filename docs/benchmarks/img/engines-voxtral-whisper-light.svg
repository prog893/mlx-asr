  <g id="text_24">
   <text style="font-weight: 700; font-size: 10px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="10.8" y="18.3" transform="rotate(-0 10.8 18.3)">Voxtral (fp16 default) against Whisper turbo-nocond, 20-file corpus</text>
  </g>
  <g id="text_25">
   <text style="font-size: 8.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans'; fill: #898781" transform="translate(10.8 290.901587)">M2 Ultra; Voxtral at fp16 is deterministic in accuracy (speed the mean of 3 runs), Whisper the mean of 6 runs with its printed 95%</text>
   <text style="font-size: 8.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans'; fill: #898781" transform="translate(10.8 299.351948)">t-interval. The speed bar spans Whisper's 6 runs around their mean. Voxtral is the default because it is faster than every Whisper</text>
   <text style="font-size: 8.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans'; fill: #898781" transform="translate(10.8 307.80231)">run and needs no language hint or stability flag, while Whisper's Japanese lead is not resolved over files. Source: engines.md.</text>
  </g>
