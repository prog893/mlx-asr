   <text style="font-size: 8.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans'; fill: #898781" transform="translate(10.8 269.301587)">20-file corpus, M4 16GB, sequential, delay 2400ms, kv8. Both paired CIs span zero, so chunk length is a throughput choice; these runs give</text>
   <text style="font-size: 8.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans'; fill: #898781" transform="translate(10.8 277.810386)">30s/B32 6.37x (mean of 3 runs) against 4.66x, so the M4 ships 30s/B32. Source: chunking.md.</text>
  </g>
