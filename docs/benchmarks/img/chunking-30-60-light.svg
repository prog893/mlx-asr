   <text style="font-size: 8.5px; font-family: 'Helvetica', 'Arial', 'DejaVu Sans'; fill: #898781" transform="translate(10.8 269.301587)">20-file corpus, M4 16GB, sequential, delay 2400ms, kv8. Both paired CIs span zero, so the M4 default 60s/B16 is set by throughput on that</text>
